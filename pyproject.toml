[project]
name = "homeassistant-kamstir"
version = "0.1.0b1"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.kamstir --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["custom_components/kamstir"]

[tool.coverage.report]
fail_under = 90
show_missing = true
